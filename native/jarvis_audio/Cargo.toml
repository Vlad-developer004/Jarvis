[package]
name = "jarvis_audio"
version.workspace = true
edition.workspace = true
publish.workspace = true

[[bin]]
name = "jarvis_audio"
path = "src/main.rs"

[dependencies]
base64 = "0.23.1"
cpal = "0.18.2"
serde_json = "1.0.154"
symphonia = { version = "0.5", default-features = false, features = ["mp3", "ogg", "vorbis", "wav", "pcm"] }

[target."cfg(windows)".dependencies]
windows = { version = "0.62.2", features = ["Win32_Media_Audio", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_UI_Shell_PropertiesSystem", "Win32_Devices_FunctionDiscovery", "Win32_Foundation", "Win32_System_Variant", "Win32_System_Threading", "Win32_Media_Audio_Endpoints"] }

[dev-dependencies]
hound = "3.5.1"
