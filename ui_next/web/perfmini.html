<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Jarvis: монитор</title>
<style>
  @font-face { font-family: Tektur; src: url(fonts/Tektur.ttf); font-weight: 400 900; font-stretch: 75% 100%; }
  @font-face { font-family: Onest; src: url(fonts/Onest.ttf); font-weight: 100 900; }
  :root { --cyan: #35e0ff; --mag: #ff5fd2; --green: #3df5ac; --purple: #a78bfa; --amber: #ffb347; --bg: rgba(6, 18, 32, .92); --line: rgba(53, 224, 255, .35); }
  * { box-sizing: border-box; margin: 0; } html, body { height: 100%; overflow: hidden; background: transparent; color: #eaf6ff; font: 500 13px Onest, sans-serif; user-select: none; }
  #w { height: 100%; display: flex; flex-direction: column; background: var(--bg); border: 1px solid var(--line); border-radius: 10px; transition: background .2s, border-color .2s; }
  #hd { display: flex; align-items: center; gap: 4px; padding: 6px 6px 6px 12px; cursor: move; font: 700 11px Tektur; letter-spacing: .12em; text-transform: uppercase; color: var(--cyan); }
  #hd span { flex: 1; pointer-events: none; }
  #hd button { width: 24px; height: 24px; border: 0; border-radius: 6px; background: transparent; color: #9fb7cc; cursor: pointer; font: 600 13px Onest; display: grid; place-items: center; } #hd button:hover { background: rgba(53, 224, 255, .18); color: #fff; } #hd button.on { color: var(--cyan); background: rgba(53, 224, 255, .14); }
  #rows { flex: 1; min-height: 0; padding: 2px 12px 10px; display: grid; align-content: start; gap: 5px; }
  .r { display: grid; grid-template-columns: 44px 1fr 62px; align-items: center; gap: 8px; height: 24px; } .r b { font: 700 11px Tektur; letter-spacing: .06em; color: var(--c); } .r em { font-style: normal; text-align: right; font-weight: 700; font-variant-numeric: tabular-nums; } .r svg { width: 100%; height: 24px; display: block; } .r path { fill: none; stroke: var(--c); stroke-width: 1.6; }
  .cpu { --c: var(--cyan); } .ram { --c: var(--mag); } .disk { --c: var(--green); } .net { --c: var(--purple); } .gpu { --c: var(--amber); } .ping { --c: var(--cyan); }
  .compact .r { grid-template-columns: 44px 1fr; height: 20px; } .compact .r svg { display: none; } .compact .r em { text-align: left; }
  .ghost #w { background: transparent; border-color: transparent; } .ghost #hd { opacity: 0; transition: opacity .2s; } .ghost #w:hover #hd { opacity: 1; } .ghost .r { text-shadow: 0 0 4px #000, 0 0 2px #000; }
  .note { padding: 4px 12px; font-size: 11px; color: #8ea6bb; }
</style></head><body>
<div id="w"><div id="hd" data-tauri-drag-region><span>Система</span>
  <button id="b-c" title="Коротко" aria-pressed="false">&#9707;</button><button id="b-g" title="Прозрачный фон" aria-pressed="false">&#9680;</button><button id="b-p" class="on" title="Поверх всех окон" aria-pressed="true">&#9906;</button><button id="b-x" title="Закрыть">&#10005;</button></div>
  <div id="rows"></div></div>
<script src="shared.js"></script>
<script>
// Small always-on-top monitor window: the old performance monitor's pinned, compact and transparent modes.
// Data is the same `perf` topic the System screen uses; the core samples only while some window sends `watch`.
(() => {
  const m = J.model, KB = 1024, MB = KB * KB, $ = (id) => document.getElementById(id);
  const p = (n) => (Math.round(n * 10) / 10).toString().replace('.', ',');
  const rate = (n) => (n == null ? '—' : n >= MB ? `${p(n / MB)} МБ/с` : `${Math.round(n / KB)} КБ/с`);
  const pct = (n) => (n == null ? '—' : `${Math.round(n)}%`);
  const ROWS = [['cpu', 'ЦП', (s) => pct(s.cpu.pct), (s) => s.hist.cpu, () => 100], ['ram', 'ОЗУ', (s) => pct(s.ram.pct), (s) => s.hist.ram, () => 100],
    ['disk', 'Диск', (s) => (s.disk.active == null ? rate(s.disk.read + s.disk.write) : pct(s.disk.active)), (s) => (s.disk.active == null ? s.hist.dio : s.hist.disk), (s) => (s.disk.active == null ? 0 : 100)],
    ['net', 'Сеть', (s) => rate(s.net.dn), (s) => s.hist.dn, () => 0], ['gpu', 'ГП', (s) => pct(s.gpu.util), (s) => s.hist.gpu, () => 100], ['ping', 'Связь', (s) => (s.ping == null ? 'нет' : `${s.ping} мс`), (s) => s.hist.ping, () => 0]];
  const spark = (pts, top) => {
    pts = (pts || []).slice(-40); if (pts.length < 2) return '';
    const t = top || Math.max(...pts, 1) * 1.15;
    return `<svg viewBox="0 0 80 24" preserveAspectRatio="none"><path d="${pts.map((v, i) => `${i ? 'L' : 'M'}${((i + 40 - pts.length) * 80 / 39).toFixed(1)} ${(22 - 20 * Math.min(v, t) / t).toFixed(1)}`).join('')}"/></svg>`;
  };
  function paint() {
    const s = m.perf;
    if (!s) { $('rows').innerHTML = `<div class="note">${m.connected ? 'Собираю данные…' : 'Jarvis не запущен'}</div>`; return; }
    $('rows').innerHTML = ROWS.map(([k, name, val, ser, top]) => `<div class="r ${k}"><b>${name}</b>${spark(ser(s), top(s))}<em>${val(s)}</em></div>`).join('');
  }
  const T = window.__TAURI__, win = T && T.window ? T.window.getCurrentWindow() : null;
  const store = (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* storage blocked */ } };
  const get = (k, d) => { try { const v = localStorage.getItem(k); return v === null ? d : v; } catch (e) { return d; } };
  let compact = get('pmCompact', '0') === '1', ghost = get('pmGhost', '0') === '1', pin = get('pmPin', '1') === '1';
  function modes() {
    document.body.classList.toggle('compact', compact); document.body.classList.toggle('ghost', ghost);
    for (const [id, on] of [['b-c', compact], ['b-g', ghost], ['b-p', pin]]) { $(id).classList.toggle('on', on); $(id).setAttribute('aria-pressed', on); }
    if (win) { win.setAlwaysOnTop(pin).catch(() => {}); win.setSize(new T.dpi.LogicalSize(compact ? 190 : 300, compact ? 200 : 232)).catch(() => {}); }
  }
  $('b-c').onclick = () => { compact = !compact; store('pmCompact', compact ? '1' : '0'); modes(); };
  $('b-g').onclick = () => { ghost = !ghost; store('pmGhost', ghost ? '1' : '0'); modes(); };
  $('b-p').onclick = () => { pin = !pin; store('pmPin', pin ? '1' : '0'); modes(); };
  $('b-x').onclick = () => (win ? win.close() : window.close());
  const watch = () => { if (m.connected) J.send('perf', { op: 'watch' }).then((r) => { if (r && r.snapshot && !m.perf) { m.perf = r.snapshot; paint(); } }); };
  J.on('perf', paint); J.on('conn', () => { paint(); watch(); });
  setInterval(watch, 5000); modes(); paint();
})();
</script>
<script src="i18n_uk.js"></script><script src="i18n.js"></script></body></html>
